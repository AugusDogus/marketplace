name: Release APK

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.13.1
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 17

      - name: Resolve release version
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Release tags must use the format v1.2.3."
            exit 1
          fi

          major=$((10#${BASH_REMATCH[1]}))
          minor=$((10#${BASH_REMATCH[2]}))
          patch=$((10#${BASH_REMATCH[3]}))
          if (( minor > 999 || patch > 999 )); then
            echo "::error::Minor and patch versions must be 999 or lower."
            exit 1
          fi

          version_code=$((major * 1000000 + minor * 1000 + patch))
          if (( version_code < 1 || version_code > 2100000000 )); then
            echo "::error::The tag produces an invalid Android version code."
            exit 1
          fi

          echo "MARKETPLACE_VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "MARKETPLACE_VERSION_CODE=$version_code" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Configure release signing
        run: node scripts/configure-android-release.mjs

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@4733eaac7c1b0da527e4206b7671e0061de1ce37 # v6
        with:
          cache-provider: basic

      - name: Install Android build tools
        run: >-
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          'platforms;android-36'
          'build-tools;36.0.0'
          'ndk;27.1.12297006'

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_BASE64" || -z "$KEYSTORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "::error::Configure the four Android signing secrets documented in RELEASING.md."
            exit 1
          fi

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/marketplace-release.keystore"
          chmod 600 "$RUNNER_TEMP/marketplace-release.keystore"

      - name: Build signed APK
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/marketplace-release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          NODE_ENV: production
        run: ./android/gradlew -p android :app:assembleRelease --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          apk_name="marketplace-${MARKETPLACE_VERSION_NAME}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$apk_name"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk_name"
          sha256sum "$apk_name" > "$apk_name.sha256"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "marketplace-${MARKETPLACE_VERSION_NAME}.apk#Marketplace ${MARKETPLACE_VERSION_NAME} APK" \
            "marketplace-${MARKETPLACE_VERSION_NAME}.apk.sha256#SHA-256 checksum" \
            --generate-notes \
            --title "Marketplace ${MARKETPLACE_VERSION_NAME}" \
            --verify-tag
